{{ $architecture := or .architecture "arm64" }}

architecture: {{ $architecture }}

actions:
# beginregion Wi-Fi
  - action: apt
    description: Installing Wi-Fi firmware packages
    recommends: true
    packages:
      - firmware-mediatek
  - action: overlay
    description: Installing internal USB Wi-Fi configuration files
    source: overlay-usb-wifi/
    destination: /
  - action: apt
    description: Installing NetworkManager
    recommends: true
    packages:
      - network-manager
# endregion
# beginregion EXTLINUX
  - action: apt
    description: Installing packages needed for EXTLINUX
    recommends: true
    packages:
      - u-boot-menu
      - initramfs-tools
  - action: overlay
    description: Installing EXTLINUX configuration files
    source: overlay-extlinux/
    destination: /
# endregion
  - action: apt
    description: Installing other necessary packages
    recommends: true
    packages:
      - pool-partitions
